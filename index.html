<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Forgotten God - Trò Chơi Nhập Vai</title>

    <!-- Google Fonts cho style Dark Fantasy -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: rgba(26, 26, 36, 0.9);
            --border-color: #3a2e56;
            --primary-glow: #9d4edd;
            --gold-glow: #ffb703;
            --text-color: #e0e1dd;
            --danger-color: #e63946;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: radial-gradient(circle at center, #1a102f 0%, #08070c 100%);
            color: var(--text-color);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Start Overlay */
        .start-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(8, 7, 12, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            text-align: center;
            padding: 20px;
        }

        .start-btn {
            margin-top: 25px;
            padding: 16px 36px;
            font-size: 1.2rem;
            font-family: 'Cinzel', serif;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(135deg, #7b2cbf, #3c096c);
            border: 2px solid var(--primary-glow);
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(157, 78, 221, 0.5);
            transition: all 0.3s ease;
        }

        .start-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(157, 78, 221, 0.8);
        }

        .key-hint {
            display: inline-block;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid var(--primary-glow);
            color: var(--gold-glow);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: bold;
            margin-right: 8px;
        }

        /* Main Container */
        .game-container {
            width: 100%;
            max-width: 750px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 0 35px rgba(157, 78, 221, 0.15),
                        inset 0 0 15px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            position: relative;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            position: relative;
        }

        .audio-toggle {
            position: absolute;
            right: 0;
            top: 0;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .audio-toggle:hover {
            background: rgba(157, 78, 221, 0.2);
        }

        .title {
            font-family: 'Cinzel', serif;
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: #fff;
            text-shadow: 0 0 12px var(--primary-glow);
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 0.95rem;
            color: #a0a0ba;
            margin-top: 5px;
            font-style: italic;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            background: rgba(10, 10, 15, 0.6);
            padding: 12px 18px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .stat-val {
            color: var(--gold-glow);
            font-weight: bold;
        }

        .story-box {
            background: rgba(0, 0, 0, 0.3);
            border-left: 3px solid var(--primary-glow);
            padding: 20px;
            border-radius: 0 8px 8px 0;
            min-height: 180px;
            margin-bottom: 25px;
            line-height: 1.7;
            font-size: 1.05rem;
            animation: fadeIn 0.4s ease-in-out;
        }

        .choices-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .choice-btn {
            background: linear-gradient(135deg, #241938 0%, #151022 100%);
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 14px 20px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            text-align: left;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .choice-btn:hover:not(:disabled) {
            border-color: var(--primary-glow);
            box-shadow: 0 0 15px rgba(157, 78, 221, 0.3);
            transform: translateY(-2px);
            background: linear-gradient(135deg, #32224e 0%, #1d1530 100%);
        }

        .choice-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            border-color: #333;
        }

        .footer {
            margin-top: 25px;
            text-align: center;
            font-size: 0.8rem;
            color: #6c6c8a;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 600px) {
            .title { font-size: 1.6rem; }
            .game-container { padding: 20px; }
            .stats-bar { flex-direction: column; gap: 8px; }
        }
    </style>
</head>
<body>

<!-- Màn hình bắt đầu -->
<div id="start-overlay" class="start-overlay">
    <h1 class="title" style="margin-bottom: 10px;">The Forgotten God</h1>
    <p style="color: #a0a0ba;">Hành trình tìm lại ký ức đã bị lãng quên...</p>
    <button class="start-btn" onclick="startGame()">
        BẮT ĐẦU HÀNH TRÌNH 🧙‍♂️ <br>
        <span style="font-size: 0.85rem; font-weight: normal; opacity: 0.8;">(Nhấn phím E hoặc Enter)</span>
    </button>
</div>

<div class="game-container">
    <div class="header">
        <button id="audio-btn" class="audio-toggle" onclick="toggleAudio()">🔊 Bật Âm Thanh</button>
        <h1 class="title">The Forgotten God</h1>
        <p class="subtitle">Vị Thần Bị Lãng Quên</p>
    </div>

    <div class="stats-bar">
        <div class="stat-item">🧙‍♂️ Vai trò: <span class="stat-val">Phù thủy lang thang</span></div>
        <div class="stat-item">📍 Vị trí: <span id="location-text" class="stat-val">Bên ngoài Vương Quốc</span></div>
        <div class="stat-item">✨ Linh hồn: <span id="souls-count" class="stat-val">0</span></div>
    </div>

    <div id="story-box" class="story-box"></div>

    <div id="choices-container" class="choices-container"></div>

    <div class="footer">
        Hỗ trợ phím tắt: <b>[E]</b> hoặc <b>[1, 2, 3...]</b> để chọn nhanh • GitHub Pages Edition
    </div>
</div>

<script>
    // ==========================================
    // HỆ THỐNG ÂM THANH (WEB AUDIO API)
    // ==========================================
    let audioCtx = null;
    let isMuted = false;
    let ambientOsc = null;

    function initAudio() {
        if (!audioCtx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
            startAmbientDrone();
        }
    }

    function toggleAudio() {
        isMuted = !isMuted;
        const btn = document.getElementById('audio-btn');
        btn.innerText = isMuted ? "🔇 Tắt Âm Thanh" : "🔊 Bật Âm Thanh";
        if (audioCtx) {
            if (isMuted) audioCtx.suspend();
            else audioCtx.resume();
        }
    }

    function playClickSFX() {
        if (!audioCtx || isMuted) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.05);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.05);
    }

    function playSoulSFX() {
        if (!audioCtx || isMuted) return;
        const now = audioCtx.currentTime;
        [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + idx * 0.08);
            gain.gain.setValueAtTime(0.1, now + idx * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.3);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now + idx * 0.08);
            osc.stop(now + idx * 0.08 + 0.3);
        });
    }

    function playFightSFX() {
        if (!audioCtx || isMuted) return;
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(40, now + 0.25);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.25);
    }

    function playRevealSFX() {
        if (!audioCtx || isMuted) return;
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(110, now);
        osc.frequency.exponentialRampToValueAtTime(55, now + 2.0);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 2.0);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 2.0);
    }

    function startAmbientDrone() {
        if (!audioCtx) return;
        ambientOsc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        ambientOsc.type = 'sine';
        ambientOsc.frequency.setValueAtTime(65.41, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
        ambientOsc.connect(gain);
        gain.connect(audioCtx.destination);
        ambientOsc.start();
    }

    // ==========================================
    // LOGIC TRÒ CHƠI & DỮ LIỆU
    // ==========================================
    let gameState = {
        souls: 0,
        metElf: false,
        hasAncientRelic: false,
        foughtMonster: false,
        cleansedSouls: false
    };

    const storyNodes = {
        start: {
            location: "Bên ngoài tàn tích Vương Quốc",
            text: "Hàng trăm năm trước, một vương quốc hùng mạnh từng được bảo hộ bởi các vị thần. Nhưng sau cuộc chiến bí ẩn, vương quốc sụp đổ, lâu đài bị bỏ hoang, khu rừng trở thành nơi hoành hành của quái vật.<br><br>Bạn tỉnh dậy giữa sương mù lạnh lẽo. Bạn không nhớ mình là ai, từ đâu đến, chỉ biết trên tay đang cầm một cây gậy phép tràn đầy ma thuật cổ xưa 🧙‍♂️.",
            choices: [
                { text: "Tiến vào Rừng Chết 🌲", target: "dead_forest" },
                { text: "Khám phá ngôi làng hoang gần đó 🏚️", target: "abandoned_village" }
            ]
        },
        dead_forest: {
            location: "Rừng Chết 🌲",
            text: "Những cái cây đen quánh như xương người vươn lên bầu trời u uất. Đột nhiên, từ bóng tối xuất hiện 🧝 một NPC bí ẩn với đôi tai nhọn và ánh mắt u buồn.<br><br><i>'Ngươi đã tỉnh rồi sao, Phù Thủy?'</i> - Người đó thì thầm. <i>'Một vị thần vẫn còn tồn tại. Hắn là **Forgotten God** – vị thần bị cả thế giới lãng quên. Để đến được Lâu Đài 🏰, ngươi phải thu thập đủ linh hồn để mở cánh cổng phép thuật.'</i>",
            onEnter: () => { gameState.metElf = true; },
            choices: [
                { 
                    text: () => gameState.foughtMonster ? "Đầm lầy Rừng Chết (Đã tiêu diệt quái vật)" : "Chiến đấu với Quái Vật Rừng 👹 (+10 Linh Hồn)", 
                    target: "fight_monster" 
                },
                { text: "Đi thẳng tới Nghĩa Địa 🪦", target: "graveyard" }
            ]
        },
        abandoned_village: {
            location: "Ngôi Làng Hoang 🏚️",
            text: "Ngôi làng tràn ngập tàn tích mục nát. Những linh hồn 💀 lang thang vất vưởng trong gió lạnh. Khi thấy bạn, họ không tấn công mà thì thầm một giai điệu quen thuộc... giai điệu mà dường như chính bạn đã từng viết ra.",
            choices: [
                { 
                    text: () => gameState.cleansedSouls ? "Thánh đường làng (Đã thanh tẩy xong)" : "Cầu nguyện và thanh tẩy Linh Hồn 💀 (+15 Linh Hồn)", 
                    target: "cleanse_souls" 
                },
                { text: "Rời làng tiến vào Rừng Chết 🌲", target: "dead_forest" }
            ]
        },
        fight_monster: {
            location: "Đầm Lầy Rừng Chết 👹",
            text: () => gameState.foughtMonster 
                ? "Nơi đây chỉ còn lại xác của sinh vật quái dị đã bị bạn đánh bại trước đó. Không còn linh hồn nào ở đây nữa." 
                : "Một sinh vật quái dị gầm lên và lao ra! Bạn giơ gậy phép, tung ra những tia sáng ma thuật rực rỡ tiêu diệt nó. Sinh vật tan biến, để lại những luồng sáng linh hồn lấp lánh.",
            onEnter: () => { 
                if (!gameState.foughtMonster) {
                    gameState.souls += 10; 
                    gameState.foughtMonster = true;
                    playFightSFX();
                }
            },
            choices: [
                { text: "Tiến về phía Nghĩa Địa Cổ 🪦", target: "graveyard" },
                { text: "Quay lại Rừng Chết 🌲", target: "dead_forest" }
            ]
        },
        cleanse_souls: {
            location: "Ngôi Làng Hoang 🏚️",
            text: () => gameState.cleansedSouls 
                ? "Các linh hồn tại đây đã được siêu thoát. Không khí trở nên yên bình lạ thường."
                : "Ánh sáng phép thuật từ tay bạn xua tan nỗi đau của các linh hồn. Trước khi biến mất, một linh hồn trao cho bạn một **Cổ Vật Ký Ức**.",
            onEnter: () => { 
                if (!gameState.cleansedSouls) {
                    gameState.souls += 15; 
                    gameState.hasAncientRelic = true;
                    gameState.cleansedSouls = true;
                    playSoulSFX();
                }
            },
            choices: [
                { text: "Đi về phía Rừng Chết 🌲", target: "dead_forest" }
            ]
        },
        graveyard: {
            location: "Nghĩa Địa Cổ 🪦",
            text: "Nghĩa địa chìm trong màn sương máu. Sức mạnh ma thuật ở đây vô cùng đậm đặc. Xa xa, đỉnh ngọn tháp Lâu Đài 🏰 rực cháy phép thuật đen đã xuất hiện ngay trước mắt.",
            choices: [
                { 
                    text: "Dùng linh hồn mở Cổng Lâu Đài 🏰 (Cần ≥10 Linh Hồn)", 
                    target: "castle_gate",
                    condition: () => gameState.souls >= 10,
                    disabledHint: "🔒 Chưa đủ Linh Hồn (Cần 10 Linh Hồn)"
                },
                { text: "Quay lại Rừng Chết 🌲", target: "dead_forest" }
            ]
        },
        castle_gate: {
            location: "Cổng Lâu Đài Hoang 🏰",
            text: "Cánh cổng đá khổng lồ tự động mở ra. Luồng gió cổ xưa thổi qua áo khoác phù thủy của bạn. Bạn bước vào ngai vàng, nơi một bóng hình khổng lồ chìm trong xích sắt đen đang chờ đợi...<br><br>Đó là **Forgotten God**.",
            choices: [
                { text: "Đối mặt với Forgotten God...", target: "final_revelation" }
            ]
        },
        final_revelation: {
            location: "Phòng Ngai Vàng 👑",
            text: `Vị thần từ từ mở mắt. Hắn không hề tức giận. Hắn nhìn bạn và mỉm cười xót xa:<br><br>
            <i>"Ngươi đã quay lại rồi sao... <b>[Phù Thủy]</b>?"</i><br><br>
            Hắn gọi chính xác **TÊN THẬT** của bạn – tên mà chính bạn cũng đã quên! Ký ức trong bạn vỡ òa:<br><br>
            Trận chiến năm xưa... không phải quái vật hay thảm họa phá hủy vương quốc. Chính **BẠN** là người đã thi triển đại phép thuật cấm đoán để xóa sạch tên tuổi của hắn khỏi tâm trí nhân loại nhằm phong ấn sức mạnh diệt thế của hắn.<br><br>
            <b>Bạn không phải là người giải cứu. Bạn chính là người đã khiến cả thế giới quên đi vị thần này.</b>`,
            onEnter: () => { playRevealSFX(); },
            choices: [
                { text: "🔄 Chơi lại từ đầu", target: "restart" }
            ]
        }
    };

    function startGame() {
        initAudio();
        document.getElementById('start-overlay').style.display = 'none';
        updatePage('start');
    }

    function updatePage(nodeKey) {
        if (nodeKey === 'restart') {
            gameState = { souls: 0, metElf: false, hasAncientRelic: false, foughtMonster: false, cleansedSouls: false };
            nodeKey = 'start';
        }

        const node = storyNodes[nodeKey];
        
        if (node.onEnter) {
            node.onEnter();
        }

        document.getElementById('location-text').innerText = node.location;
        document.getElementById('souls-count').innerText = gameState.souls;
        
        const storyBox = document.getElementById('story-box');
        storyBox.innerHTML = typeof node.text === 'function' ? node.text() : node.text;
        
        storyBox.style.animation = 'none';
        storyBox.offsetHeight;
        storyBox.style.animation = 'fadeIn 0.4s ease-in-out';

        const choicesContainer = document.getElementById('choices-container');
        choicesContainer.innerHTML = '';

        node.choices.forEach((choice, index) => {
            const btn = document.createElement('button');
            btn.className = 'choice-btn';
            
            const choiceText = typeof choice.text === 'function' ? choice.text() : choice.text;
            const meetsCondition = !choice.condition || choice.condition();

            // Hiển thị nhãn phím tắt [E / 1] cho nút đầu tiên, [2], [3] cho các nút tiếp theo
            const keyLabel = index === 0 ? `E / 1` : `${index + 1}`;

            if (meetsCondition) {
                btn.innerHTML = `<span><span class="key-hint">[${keyLabel}]</span>${choiceText}</span> <span>➔</span>`;
                btn.onclick = () => {
                    playClickSFX();
                    updatePage(choice.target);
                };
            } else {
                btn.disabled = true;
                btn.innerHTML = `<span><span class="key-hint" style="opacity:0.4">[${keyLabel}]</span>${choice.disabledHint || choiceText}</span> <span>🔒</span>`;
            }

            choicesContainer.appendChild(btn);
        });
    }

    // ==========================================
    // BẮT SỰ KIỆN BÀN PHÍM (KEYBOARD CONTROLS)
    // ==========================================
    document.addEventListener('keydown', (event) => {
        const key = event.key.toLowerCase();
        const startOverlay = document.getElementById('start-overlay');

        // 1. Nếu đang ở màn hình Start: Bấm 'E', 'Enter' hoặc 'Space' để Bắt đầu
        if (startOverlay && startOverlay.style.display !== 'none') {
            if (key === 'e' || key === 'enter' || key === ' ') {
                event.preventDefault();
                startGame();
            }
            return;
        }

        // 2. Xử lý phím 'E', 'Enter' hoặc 'Space' trong game: Chọn lựa chọn đầu tiên khả dụng
        if (key === 'e' || key === 'enter' || key === ' ') {
            event.preventDefault();
            const firstAvailableBtn = document.querySelector('#choices-container .choice-btn:not(:disabled)');
            if (firstAvailableBtn) {
                firstAvailableBtn.click();
            }
            return;
        }

        // 3. Xử lý phím số '1', '2', '3', '4' để chọn trực tiếp theo thứ tự
        if (['1', '2', '3', '4', '5'].includes(key)) {
            const btnIndex = parseInt(key) - 1;
            const allButtons = document.querySelectorAll('#choices-container .choice-btn');
            if (allButtons[btnIndex] && !allButtons[btnIndex].disabled) {
                event.preventDefault();
                allButtons[btnIndex].click();
            }
        }
    });
</script>

</body>
</html>
