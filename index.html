<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>THE FORGOTTEN GOD</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050407;
    font-family:Georgia,serif;
    color:#e5d0a0;
}

#game{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    background:#08070a;
}

canvas{
    display:block;
    width:100%;
    height:100%;
}

#ui{
    position:fixed;
    inset:0;
    pointer-events:none;
}

#healthBox{
    position:absolute;
    left:25px;
    top:25px;
    width:260px;
}

#healthText{
    font-size:14px;
    letter-spacing:2px;
    margin-bottom:7px;
}

#healthBar{
    width:100%;
    height:16px;
    border:1px solid #a78b62;
    background:#170b10;
}

#healthFill{
    width:100%;
    height:100%;
    background:#8d2636;
}

#level{
    margin-top:10px;
    font-size:14px;
    letter-spacing:2px;
}

#instructions{
    position:absolute;
    bottom:22px;
    left:50%;
    transform:translateX(-50%);
    text-align:center;
    color:#8d8277;
    font-size:13px;
    letter-spacing:1px;
}

#enemyCount{
    position:absolute;
    right:25px;
    top:25px;
    font-size:14px;
    letter-spacing:2px;
}

#message{
    position:absolute;
    top:45%;
    left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
    pointer-events:none;
}

#message h1{
    font-size:clamp(35px,6vw,80px);
    letter-spacing:8px;
    text-shadow:
        0 0 20px #8d2636,
        0 0 50px #4d101d;
}

#message p{
    margin-top:15px;
    color:#9d9180;
    letter-spacing:4px;
}

#gameOver{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.85);
    z-index:10;
    text-align:center;
}

#gameOver h1{
    font-size:70px;
    letter-spacing:10px;
    color:#b94655;
}

#gameOver p{
    margin:20px;
    color:#aaa;
}

#restart{
    pointer-events:auto;
    padding:15px 35px;
    background:#100b10;
    color:#d8bd8c;
    border:1px solid #a78b62;
    cursor:pointer;
    font-family:Georgia,serif;
    letter-spacing:3px;
}

#musicButton{
    position:absolute;
    right:25px;
    bottom:25px;
    pointer-events:auto;
    width:50px;
    height:50px;
    border-radius:50%;
    border:1px solid #8c7657;
    background:#100c10;
    color:#d8bd8c;
    cursor:pointer;
}
</style>
</head>

<body>

<div id="game">
    <canvas id="canvas"></canvas>
</div>

<div id="ui">

    <div id="healthBox">
        <div id="healthText">LIFE</div>

        <div id="healthBar">
            <div id="healthFill"></div>
        </div>

        <div id="level">
            LEVEL <span id="levelNumber">1</span>
            &nbsp;&nbsp;
            SOUL <span id="xp">0</span>
        </div>
    </div>

    <div id="enemyCount">
        ENEMIES: <span id="enemies">0</span>
    </div>

    <div id="instructions">
        WASD — MOVE &nbsp;&nbsp; SPACE / LEFT CLICK — ATTACK
    </div>

    <div id="message">
        <h1>THE LOST KINGDOM</h1>
        <p>THE GOD HAS AWAKENED</p>
    </div>

    <button id="musicButton">🔊</button>

</div>

<div id="gameOver">

    <div>

        <h1>YOU DIED</h1>

        <p>
            THE FORGOTTEN GOD REMEMBERS YOU
        </p>

        <button id="restart">
            RETURN TO THE WORLD
        </button>

    </div>

</div>

<audio id="music" loop>
    <source src="./music.mp3" type="audio/mpeg">
</audio>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W = 0;
let H = 0;

function resize(){
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}

resize();
window.addEventListener("resize",resize);


/* =========================
   WORLD
========================= */

const world = {
    width:3000,
    height:2000
};


/* =========================
   PLAYER
========================= */

const player = {

    x:1500,
    y:1000,

    radius:18,

    speed:4,

    health:100,
    maxHealth:100,

    level:1,
    xp:0,

    attackCooldown:0,
    attackTimer:0

};


/* =========================
   CAMERA
========================= */

const camera = {
    x:0,
    y:0
};


/* =========================
   INPUT
========================= */

const keys = {};

window.addEventListener("keydown",e=>{
    keys[e.key.toLowerCase()] = true;

    if(e.code === "Space"){
        attack();
    }
});

window.addEventListener("keyup",e=>{
    keys[e.key.toLowerCase()] = false;
});

canvas.addEventListener("mousedown",()=>{
    attack();
});


/* =========================
   ENEMIES
========================= */

let enemies = [];

function spawnEnemy(){

    const side =
        Math.floor(Math.random()*4);

    let x;
    let y;

    if(side===0){
        x=Math.random()*world.width;
        y=50;
    }

    if(side===1){
        x=world.width-50;
        y=Math.random()*world.height;
    }

    if(side===2){
        x=Math.random()*world.width;
        y=world.height-50;
    }

    if(side===3){
        x=50;
        y=Math.random()*world.height;
    }

    enemies.push({

        x,
        y,

        radius:17,

        health:40,

        speed:
            0.65+
            Math.random()*0.45,

        hit:0

    });

}


/* =========================
   PARTICLES
========================= */

let particles=[];

for(let i=0;i<250;i++){

    particles.push({

        x:Math.random()*world.width,

        y:Math.random()*world.height,

        r:Math.random()*2+.5,

        a:Math.random()

    });

}


/* =========================
   ATTACK
========================= */

function attack(){

    if(player.attackCooldown>0){
        return;
    }

    player.attackCooldown=25;
    player.attackTimer=10;

    for(const enemy of enemies){

        const dx =
            enemy.x-player.x;

        const dy =
            enemy.y-player.y;

        const distance =
            Math.sqrt(dx*dx+dy*dy);

        if(distance<90){

            enemy.health-=35;

            enemy.hit=8;

        }

    }

}


/* =========================
   MOVEMENT
========================= */

function movePlayer(){

    let dx=0;
    let dy=0;

    if(keys["w"]){
        dy-=1;
    }

    if(keys["s"]){
        dy+=1;
    }

    if(keys["a"]){
        dx-=1;
    }

    if(keys["d"]){
        dx+=1;
    }

    if(dx!==0 || dy!==0){

        const length =
            Math.sqrt(dx*dx+dy*dy);

        dx/=length;
        dy/=length;

        player.x += dx*player.speed;
        player.y += dy*player.speed;

    }

    player.x =
        Math.max(
            30,
            Math.min(
                world.width-30,
                player.x
            )
        );

    player.y =
        Math.max(
            30,
            Math.min(
                world.height-30,
                player.y
            )
        );

}


/* =========================
   ENEMY AI
========================= */

function updateEnemies(){

    for(const enemy of enemies){

        const dx =
            player.x-enemy.x;

        const dy =
            player.y-enemy.y;

        const distance =
            Math.sqrt(dx*dx+dy*dy);

        if(distance>35){

            enemy.x +=
                dx/distance*
                enemy.speed;

            enemy.y +=
                dy/distance*
                enemy.speed;

        }else{

            player.health-=0.18;

        }

        if(enemy.hit>0){
            enemy.hit--;
        }

    }

    enemies =
        enemies.filter(enemy=>{

            if(enemy.health<=0){

                player.xp+=10;

                return false;

            }

            return true;

        });

}


/* =========================
   LEVEL
========================= */

function updateLevel(){

    const required =
        player.level*50;

    if(player.xp>=required){

        player.xp-=required;

        player.level++;

        player.maxHealth+=20;

        player.health=
            player.maxHealth;

    }

}


/* =========================
   CAMERA
========================= */

function updateCamera(){

    camera.x =
        player.x-W/2;

    camera.y =
        player.y-H/2;

    camera.x =
        Math.max(
            0,
            Math.min(
                world.width-W,
                camera.x
            )
        );

    camera.y =
        Math.max(
            0,
            Math.min(
                world.height-H,
                camera.y
            )
        );

}


/* =========================
   DRAW WORLD
========================= */

function drawWorld(){

    ctx.fillStyle="#09080b";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /* moon */

    const moonX =
        2450-camera.x;

    const moonY =
        260-camera.y;

    const gradient =
        ctx.createRadialGradient(
            moonX,
            moonY,
            20,
            moonX,
            moonY,
            180
        );

    gradient.addColorStop(
        0,
        "rgba(240,220,175,.8)"
    );

    gradient.addColorStop(
        1,
        "rgba(240,220,175,0)"
    );

    ctx.fillStyle=gradient;

    ctx.beginPath();

    ctx.arc(
        moonX,
        moonY,
        180,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.fillStyle="#e9dcbf";

    ctx.beginPath();

    ctx.arc(
        moonX,
        moonY,
        65,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* ground */

    ctx.fillStyle="#0d0c0f";

    ctx.fillRect(
        -camera.x,
        -camera.y,
        world.width,
        world.height
    );


    /* paths */

    ctx.strokeStyle=
        "rgba(100,75,55,.18)";

    ctx.lineWidth=100;

    ctx.beginPath();

    ctx.moveTo(
        0-camera.x,
        1000-camera.y
    );

    ctx.lineTo(
        world.width-camera.x,
        1000-camera.y
    );

    ctx.stroke();


    /* particles */

    for(const p of particles){

        const x =
            p.x-camera.x;

        const y =
            p.y-camera.y;

        if(
            x<0 ||
            x>W ||
            y<0 ||
            y>H
        ){
            continue;
        }

        ctx.fillStyle=
            `rgba(190,160,120,${p.a*.35})`;

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            p.r,
            0,
            Math.PI*2
        );

        ctx.fill();

    }


    /* ruins */

    drawRuins();

}


/* =========================
   RUINS
========================= */

function drawRuins(){

    const ruins=[

        [400,500],
        [700,1400],
        [2200,600],
        [2500,1500],
        [1200,300],
        [1700,1600]

    ];

    for(const r of ruins){

        const x=r[0]-camera.x;
        const y=r[1]-camera.y;

        ctx.fillStyle="#161318";

        ctx.fillRect(
            x-30,
            y-70,
            60,
            140
        );

        ctx.fillStyle="#211c20";

        ctx.fillRect(
            x-42,
            y-80,
            84,
            12
        );

    }

}


/* =========================
   DRAW PLAYER
========================= */

function drawPlayer(){

    const x =
        player.x-camera.x;

    const y =
        player.y-camera.y;


    /* shadow */

    ctx.fillStyle=
        "rgba(0,0,0,.6)";

    ctx.beginPath();

    ctx.ellipse(
        x,
        y+18,
        25,
        10,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* aura */

    const aura =
        ctx.createRadialGradient(
            x,
            y,
            5,
            x,
            y,
            50
        );

    aura.addColorStop(
        0,
        "rgba(170,50,60,.35)"
    );

    aura.addColorStop(
        1,
        "rgba(170,50,60,0)"
    );

    ctx.fillStyle=aura;

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        50,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* body */

    ctx.fillStyle="#21151c";

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        player.radius,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* head */

    ctx.fillStyle="#bda486";

    ctx.beginPath();

    ctx.arc(
        x,
        y-10,
        8,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* sword */

    ctx.strokeStyle="#d7c49d";

    ctx.lineWidth=4;

    ctx.beginPath();

    ctx.moveTo(
        x+10,
        y-4
    );

    ctx.lineTo(
        x+32,
        y-27
    );

    ctx.stroke();


    /* attack */

    if(player.attackTimer>0){

        ctx.strokeStyle=
            "rgba(230,200,150,.7)";

        ctx.lineWidth=5;

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            65,
            -0.9,
            0.9
        );

        ctx.stroke();

    }

}


/* =========================
   DRAW ENEMIES
========================= */

function drawEnemies(){

    for(const enemy of enemies){

        const x =
            enemy.x-camera.x;

        const y =
            enemy.y-camera.y;


        ctx.fillStyle=
            enemy.hit>0
            ? "#ddd"
            : "#3b111b";


        ctx.beginPath();

        ctx.arc(
            x,
            y,
            enemy.radius,
            0,
            Math.PI*2
        );

        ctx.fill();


        /* eyes */

        ctx.fillStyle="#e44b4b";

        ctx.fillRect(
            x-7,
            y-4,
            4,
            4
        );

        ctx.fillRect(
            x+3,
            y-4,
            4,
            4
        );


        /* health */

        ctx.fillStyle="#261014";

        ctx.fillRect(
            x-18,
            y-28,
            36,
            4
        );

        ctx.fillStyle="#a52c3c";

        ctx.fillRect(
            x-18,
            y-28,
            36*
            Math.max(
                0,
                enemy.health/40
            ),
            4
        );

    }

}


/* =========================
   UI
========================= */

function updateUI(){

    const percentage =
        Math.max(
            0,
            player.health/
            player.maxHealth*
            100
        );

    document
        .getElementById("healthFill")
        .style.width=
        percentage+"%";


    document
        .getElementById("levelNumber")
        .textContent=
        player.level;


    document
        .getElementById("xp")
        .textContent=
        player.xp;


    document
        .getElementById("enemies")
        .textContent=
        enemies.length;

}


/* =========================
   GAME OVER
========================= */

function checkDeath(){

    if(player.health<=0){

        player.health=0;

        document
            .getElementById("gameOver")
            .style.display=
            "flex";

    }

}


/* =========================
   RESET
========================= */

function resetGame(){

    player.x=1500;
    player.y=1000;

    player.health=100;
    player.maxHealth=100;

    player.level=1;
    player.xp=0;

    enemies=[];

    document
        .getElementById("gameOver")
        .style.display=
        "none";

}


/* =========================
   SPAWN TIMER
========================= */

let spawnTimer=0;


/* =========================
   GAME LOOP
========================= */

function gameLoop(){

    if(
        document
        .getElementById("gameOver")
        .style.display
        !=="flex"
    ){

        movePlayer();

        updateEnemies();

        updateLevel();

        updateCamera();

        if(player.attackCooldown>0){
            player.attackCooldown--;
        }

        if(player.attackTimer>0){
            player.attackTimer--;
        }


        spawnTimer--;

        if(spawnTimer<=0){

            if(enemies.length<15){

                spawnEnemy();

            }

            spawnTimer=90;

        }


        checkDeath();

        updateUI();

    }


    drawWorld();

    drawEnemies();

    drawPlayer();


    requestAnimationFrame(
        gameLoop
    );

}


gameLoop();


/* =========================
   MUSIC
========================= */

const music =
    document.getElementById("music");

const musicButton =
    document.getElementById("musicButton");


music.volume=.35;


document
    .getElementById("musicButton")
    .addEventListener(
        "click",
        ()=>{

            if(music.paused){

                music.play();

                musicButton.textContent="🔊";

            }else{

                music.pause();

                musicButton.textContent="🔇";

            }

        }
    );


/*
   Bấm vào trang lần đầu sẽ thử phát nhạc.
*/

window.addEventListener(
    "click",
    ()=>{
        if(music.paused){
            music.play().catch(()=>{});
        }
    },
    {once:true}
);


/* =========================
   RESTART
========================= */

document
    .getElementById("restart")
    .addEventListener(
        "click",
        resetGame
    );

</script>

</body>
</html>
