<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Forgotten God - Trò Chơi Nhập Vai</title>

    <!-- Google Fonts cho style Dark Fantasy -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: rgba(26, 26, 36, 0.85);
            --border-color: #3a2e56;
            --primary-glow: #9d4edd;
            --gold-glow: #ffb703;
            --text-color: #e0e1dd;
            --danger-color: #e63946;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: radial-gradient(circle at center, #1a102f 0%, #08070c 100%);
            color: var(--text-color);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .game-container {
            width: 100%;
            max-width: 750px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 0 35px rgba(157, 78, 221, 0.15),
                        inset 0 0 15px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            position: relative;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        .title {
            font-family: 'Cinzel', serif;
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: #fff;
            text-shadow: 0 0 12px var(--primary-glow);
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 0.95rem;
            color: #a0a0ba;
            margin-top: 5px;
            font-style: italic;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            background: rgba(10, 10, 15, 0.6);
            padding: 10px 18px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .stat-val {
            color: var(--gold-glow);
            font-weight: bold;
        }

        .story-box {
            background: rgba(0, 0, 0, 0.3);
            border-left: 3px solid var(--primary-glow);
            padding: 20px;
            border-radius: 0 8px 8px 0;
            min-height: 180px;
            margin-bottom: 25px;
            line-height: 1.7;
            font-size: 1.05rem;
            animation: fadeIn 0.5s ease-in-out;
        }

        .choices-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .choice-btn {
            background: linear-gradient(135deg, #241938 0%, #151022 100%);
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 14px 20px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            text-align: left;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .choice-btn:hover {
            border-color: var(--primary-glow);
            box-shadow: 0 0 15px rgba(157, 78, 221, 0.3);
            transform: translateY(-2px);
            background: linear-gradient(135deg, #32224e 0%, #1d1530 100%);
        }

        .choice-btn:active {
            transform: translateY(0);
        }

        .footer {
            margin-top: 25px;
            text-align: center;
            font-size: 0.8rem;
            color: #6c6c8a;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 600px) {
            .title { font-size: 1.6rem; }
            .game-container { padding: 20px; }
            .stats-bar { flex-direction: column; gap: 8px; }
        }
    </style>
</head>
<body>

<div class="game-container">
    <div class="header">
        <h1 class="title">The Forgotten God</h1>
        <p class="subtitle">Vị Thần Bị Lãng Quên</p>
    </div>

    <div class="stats-bar">
        <div class="stat-item">🧙‍♂️ Vai trò: <span class="stat-val">Phù thủy lang thang</span></div>
        <div class="stat-item">📍 Vị trí: <span id="location-text" class="stat-val">Bên ngoài Vương Quốc</span></div>
        <div class="stat-item">✨ Linh hồn (Souls): <span id="souls-count" class="stat-val">0</span></div>
    </div>

    <div id="story-box" class="story-box">
        <!-- Nội dung cốt truyện sẽ hiển thị ở đây -->
    </div>

    <div id="choices-container" class="choices-container">
        <!-- Các lựa chọn sẽ hiển thị ở đây -->
    </div>

    <div class="footer">
        Cốt truyện & Mã nguồn tối ưu cho GitHub Pages • 2026
    </div>
</div>

<script>
    // Trạng thái người chơi
    let gameState = {
        souls: 0,
        metElf: false,
        hasAncientRelic: false
    };

    // Dữ liệu các chương cốt truyện
    const storyNodes = {
        start: {
            location: "Bên ngoài tàn tích Vương Quốc",
            text: "Hàng trăm năm trước, một vương quốc hùng mạnh từng được bảo hộ bởi các vị thần. Nhưng sau cuộc chiến bí ẩn, vương quốc sụp đổ, lâu đài bị bỏ hoang, khu rừng trở thành nơi hoành hành của quái vật.<br><br>Bạn tỉnh dậy giữa sương mù lạnh lẽo. Bạn không nhớ mình là ai, từ đâu đến, chỉ biết trên tay đang cầm một cây gậy phép tràn đầy ma thuật cổ xưa 🧙‍♂️.",
            choices: [
                { text: "Tiến vào Rừng Chết 🌲", target: "dead_forest" },
                { text: "Khám phá ngôi làng hoang gần đó 🏚️", target: "abandoned_village" }
            ]
        },
        dead_forest: {
            location: "Rừng Chết 🌲",
            text: "Những cái cây đen quánh như xương người vươn lên bầu trời u uất. Đột nhiên, từ bóng tối xuất hiện 🧝 một NPC bí ẩn với đôi tai nhọn và ánh mắt u buồn.<br><br><i>'Ngươi đã tỉnh rồi sao, Phù Thủy?'</i> - Người đó thì thầm. <i>'Một vị thần vẫn còn tồn tại. Hắn là **Forgotten God** – vị thần bị cả thế giới lãng quên. Để đến được Lâu Đài 🏰, ngươi phải thu thập đủ linh hồn để mở cánh cổng phép thuật.'</i>",
            onEnter: () => { gameState.metElf = true; },
            choices: [
                { text: "Chiến đấu với Quái Vật Rừng 👹 (+10 Linh Hồn)", target: "fight_monster" },
                { text: "Đi thẳng tới Nghĩa Địa 🪦", target: "graveyard" }
            ]
        },
        abandoned_village: {
            location: "Ngôi Làng Hoang 🏚️",
            text: "Ngôi làng tràn ngập tàn tích mục nát. Những linh hồn 💀 lang thang vất vưởng trong gió lạnh. Khi thấy bạn, họ không tấn công mà thì thầm một giai điệu quen thuộc... giai điệu mà dường như chính bạn đã từng viết ra.",
            choices: [
                { text: "Cầu nguyện và thanh tẩy Linh Hồn 💀 (+15 Linh Hồn)", target: "cleanse_souls" },
                { text: "Rời làng tiến vào Rừng Chết 🌲", target: "dead_forest" }
            ]
        },
        fight_monster: {
            location: "Đầm Lầy Rừng Chết 👹",
            text: "Một sinh vật quái dị gầm lên và lao ra! Bạn giơ gậy phép, tung ra những tia sáng ma thuật rực rỡ tiêu diệt nó. Sinh vật tan biến, để lại những luồng sáng linh hồn lấp lánh.",
            onEnter: () => { gameState.souls += 10; },
            choices: [
                { text: "Tiến về phía Nghĩa Địa Cổ 🪦", target: "graveyard" }
            ]
        },
        cleanse_souls: {
            location: "Ngôi Làng Hoang 🏚️",
            text: "Ánh sáng phép thuật từ tay bạn xua tan nỗi đau của các linh hồn. Trước khi biến mất, một linh hồn trao cho bạn một **Cổ Vật Ký Ức**.",
            onEnter: () => { 
                gameState.souls += 15; 
                gameState.hasAncientRelic = true;
            },
            choices: [
                { text: "Đi về phía Rừng Chết 🌲", target: "dead_forest" }
            ]
        },
        graveyard: {
            location: "Nghĩa Địa Cổ 🪦",
            text: "Nghĩa địa chìm trong màn sương máu. Sức mạnh ma thuật ở đây vô cùng đậm đặc. Xa xa, đỉnh ngọn tháp Lâu Đài 🏰 rực cháy phép thuật đen đã xuất hiện ngay trước mắt.",
            choices: [
                { 
                    text: "Dùng linh hồn mở Cổng Lâu Đài 🏰 (Cần ≥10 Linh Hồn)", 
                    target: "castle_gate",
                    condition: () => gameState.souls >= 10
                },
                { 
                    text: "Săn thêm linh hồn ở Rừng Chết 🌲", 
                    target: "fight_monster" 
                }
            ]
        },
        castle_gate: {
            location: "Cổng Lâu Đài Hoang 🏰",
            text: "Cánh cổng đá khổng lồ tự động mở ra. Luồng gió cổ xưa thổi qua áo khoác phù thủy của bạn. Bạn bước vào ngai vàng, nơi một bóng hình khổng lồ chìm trong xích sắt đen đang chờ đợi...<br><br>Đó là **Forgotten God**.",
            choices: [
                { text: "Đối mặt với Forgotten God...", target: "final_revelation" }
            ]
        },
        final_revelation: {
            location: "Phòng Ngai Vàng 👑",
            text: `Vị thần từ từ mở mắt. Hắn không hề tức giận. Hắn nhìn bạn và mỉm cười xót xa:<br><br>
            <i>"Ngươi đã quay lại rồi sao... <b>[Phù Thủy]</b>?"</i><br><br>
            Hắn gọi chính xác **TÊN THẬT** của bạn – tên mà chính bạn cũng đã quên! Ký ức trong bạn vỡ òa:<br><br>
            Trận chiến năm xưa... không phải quái vật hay thảm họa phá hủy vương quốc. Chính **BẠN** là người đã thi triển đại phép thuật cấm đoán để xóa sạch tên tuổi của hắn khỏi tâm trí nhân loại nhằm phong ấn sức mạnh diệt thế của hắn.<br><br>
            <b>Bạn không phải là người giải cứu. Bạn chính là người đã khiến cả thế giới quên đi vị thần này.</b>`,
            choices: [
                { text: "🔄 Chơi lại từ đầu", target: "restart" }
            ]
        }
    };

    function updatePage(nodeKey) {
        if (nodeKey === 'restart') {
            gameState = { souls: 0, metElf: false, hasAncientRelic: false };
            nodeKey = 'start';
        }

        const node = storyNodes[nodeKey];
        
        // Chạy hàm bổ trợ nếu có
        if (node.onEnter) {
            node.onEnter();
        }

        // Cập nhật giao diện
        document.getElementById('location-text').innerText = node.location;
        document.getElementById('souls-count').innerText = gameState.souls;
        
        // Cập nhật văn bản câu chuyện
        const storyBox = document.getElementById('story-box');
        storyBox.innerHTML = node.text;
        
        // Reset animation
        storyBox.style.animation = 'none';
        storyBox.offsetHeight; /* trigger reflow */
        storyBox.style.animation = 'fadeIn 0.5s ease-in-out';

        // Cập nhật các lựa chọn
        const choicesContainer = document.getElementById('choices-container');
        choicesContainer.innerHTML = '';

        node.choices.forEach(choice => {
            // Kiểm tra điều kiện mở nút (nếu có)
            if (choice.condition && !choice.condition()) {
                return;
            }

            const btn = document.createElement('button');
            btn.className = 'choice-btn';
            btn.innerHTML = `<span>${choice.text}</span> <span>➔</span>`;
            btn.onclick = () => updatePage(choice.target);
            choicesContainer.appendChild(btn);
        });
    }

    // Bắt đầu game khi tải trang
    window.onload = () => {
        updatePage('start');
    };
</script>

</body>
</html>
