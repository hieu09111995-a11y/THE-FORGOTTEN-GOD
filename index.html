<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>THE FORGOTTEN GOD</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050509;
    font-family:Arial,sans-serif;
}

/* GAME */

#game{
    position:fixed;
    inset:0;
    background:#08080d;
}

canvas{
    display:block;
    width:100%;
    height:100%;
}

/* START SCREEN */

#startScreen{
    position:fixed;
    inset:0;
    z-index:20;

    display:flex;
    justify-content:center;
    align-items:center;

    text-align:center;

    background:
        radial-gradient(
            circle,
            #24131d 0%,
            #09070b 45%,
            #020204 100%
        );
}

.startBox{
    width:90%;
    max-width:700px;
}

.logo{
    color:#e8d09d;

    font-family:Georgia,serif;

    font-size:clamp(
        45px,
        9vw,
        100px
    );

    line-height:.9;

    letter-spacing:8px;

    text-shadow:
        0 0 15px #8c3546,
        0 0 50px #4b1523;
}

.subtitle{
    margin-top:25px;

    color:#9c8d7c;

    letter-spacing:6px;

    font-size:14px;
}

.startButton{
    margin-top:55px;

    width:280px;
    height:60px;

    border:1px solid #a98a60;

    background:#100c11;

    color:#dfc48e;

    font-family:Georgia,serif;

    font-size:15px;

    letter-spacing:4px;

    cursor:pointer;

    transition:.3s;
}

.startButton:hover{
    background:#24151c;

    box-shadow:
        0 0 25px #6e2637;

    transform:scale(1.04);
}

/* UI */

#ui{
    position:fixed;
    inset:0;

    z-index:5;

    pointer-events:none;
}

#stats{
    position:absolute;

    top:20px;
    left:20px;

    width:250px;

    color:#ddd;

    font-size:14px;
}

#healthBackground{
    width:250px;
    height:18px;

    margin-top:8px;

    border:1px solid #826a4e;

    background:#180b10;
}

#health{
    width:100%;
    height:100%;

    background:#a52f43;
}

#score{
    margin-top:10px;

    color:#d5bd8c;

    letter-spacing:2px;
}

#help{
    position:absolute;

    bottom:20px;
    left:50%;

    transform:translateX(-50%);

    color:#8d8378;

    font-size:13px;

    text-align:center;
}

/* GAME OVER */

#gameOver{
    position:fixed;
    inset:0;

    z-index:30;

    display:none;

    justify-content:center;
    align-items:center;

    text-align:center;

    background:rgba(0,0,0,.88);
}

.gameOverTitle{
    color:#c24a58;

    font-family:Georgia,serif;

    font-size:70px;

    letter-spacing:8px;
}

#restartButton{
    margin-top:30px;

    width:240px;
    height:55px;

    background:#120d12;

    color:#ddc18b;

    border:1px solid #9c8058;

    cursor:pointer;

    letter-spacing:3px;
}

/* MOBILE CONTROLS */

#mobileControls{
    display:none;

    position:fixed;

    left:20px;
    bottom:70px;

    z-index:10;
}

.controlRow{
    display:flex;

    justify-content:center;
}

.control{
    width:55px;
    height:55px;

    margin:3px;

    border-radius:8px;

    border:1px solid #806a50;

    background:rgba(20,15,20,.75);

    color:#d9c18e;

    font-size:20px;
}

#attackButton{
    position:fixed;

    right:30px;
    bottom:80px;

    z-index:10;

    display:none;

    width:80px;
    height:80px;

    border-radius:50%;

    border:1px solid #a97865;

    background:rgba(50,15,25,.8);

    color:#e6c995;

    font-size:16px;
}

@media(max-width:700px){

    #mobileControls{
        display:block;
    }

    #attackButton{
        display:block;
    }

    #help{
        display:none;
    }

}

</style>
</head>

<body>


<!-- =========================================
     GAME
========================================= -->

<div id="game">

    <canvas id="canvas"></canvas>

</div>


<!-- =========================================
     START SCREEN
========================================= -->

<div id="startScreen">

    <div class="startBox">

        <div class="logo">

            THE<br>
            FORGOTTEN<br>
            GOD

        </div>

        <div class="subtitle">

            THE DARKNESS REMEMBERS

        </div>

        <button
            class="startButton"
            id="startButton">

            ENTER THE WORLD

        </button>

    </div>

</div>


<!-- =========================================
     UI
========================================= -->

<div id="ui">

    <div id="stats">

        <div>
            LIFE
        </div>

        <div id="healthBackground">

            <div id="health"></div>

        </div>

        <div id="score">

            SOULS:
            <span id="scoreNumber">
                0
            </span>

        </div>

    </div>


    <div id="help">

        WASD = MOVE &nbsp;&nbsp;&nbsp;
        SPACE / LEFT CLICK = ATTACK

    </div>


    <!-- MOBILE -->

    <div id="mobileControls">

        <div class="controlRow">

            <button
                class="control"
                id="up">

                ▲

            </button>

        </div>

        <div class="controlRow">

            <button
                class="control"
                id="left">

                ◀

            </button>

            <button
                class="control"
                id="down">

                ▼

            </button>

            <button
                class="control"
                id="right">

                ▶

            </button>

        </div>

    </div>


    <button
        id="attackButton">

        ATTACK

    </button>

</div>


<!-- =========================================
     GAME OVER
========================================= -->

<div id="gameOver">

    <div>

        <div class="gameOverTitle">

            YOU DIED

        </div>

        <div
            style="
            margin-top:15px;
            color:#8f8378;
            ">

            THE DARKNESS CLAIMED YOU

        </div>

        <button
            id="restartButton">

            TRY AGAIN

        </button>

    </div>

</div>


<script>

/* =========================================
   CANVAS
========================================= */

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

let width;
let height;


function resize(){

    width =
        canvas.width =
        window.innerWidth;

    height =
        canvas.height =
        window.innerHeight;

}

resize();

window.addEventListener(
    "resize",
    resize
);


/* =========================================
   GAME STATE
========================================= */

let running = false;

let score = 0;

let keys = {};


/* =========================================
   PLAYER
========================================= */

const player = {

    x:0,
    y:0,

    size:24,

    speed:4,

    health:100,

    maxHealth:100,

    attackTimer:0,

    invincible:0

};


/* =========================================
   ENEMIES
========================================= */

let enemies = [];


/* =========================================
   WORLD
========================================= */

const world = {

    width:2400,

    height:1600

};


let camera = {

    x:0,
    y:0

};


/* =========================================
   INPUT
========================================= */

window.addEventListener(
    "keydown",
    function(e){

        keys[e.key.toLowerCase()] =
            true;

        if(e.code === "Space"){

            e.preventDefault();

            attack();

        }

    }
);


window.addEventListener(
    "keyup",
    function(e){

        keys[e.key.toLowerCase()] =
            false;

    }
);


canvas.addEventListener(
    "mousedown",
    function(){

        attack();

    }
);


/* =========================================
   START
========================================= */

document
.getElementById("startButton")
.addEventListener(
    "click",
    function(){

        document
        .getElementById("startScreen")
        .style.display =
        "none";

        startGame();

    }
);


/* =========================================
   START GAME
========================================= */

function startGame(){

    running = true;

    score = 0;

    player.x =
        world.width / 2;

    player.y =
        world.height / 2;

    player.health =
        player.maxHealth;

    enemies = [];

    for(
        let i=0;
        i<8;
        i++
    ){

        spawnEnemy();

    }

    gameLoop();

}


/* =========================================
   SPAWN ENEMY
========================================= */

function spawnEnemy(){

    let x;
    let y;

    do{

        x =
            100 +
            Math.random() *
            (world.width-200);

        y =
            100 +
            Math.random() *
            (world.height-200);

    }

    while(
        Math.abs(
            x-player.x
        )<300
    );


    enemies.push({

        x:x,

        y:y,

        size:22,

        speed:
            0.7+
            Math.random()*.6,

        health:2,

        hit:0

    });

}


/* =========================================
   ATTACK
========================================= */

function attack(){

    if(!running){

        return;

    }

    if(player.attackTimer>0){

        return;

    }

    player.attackTimer =
        15;


    for(
        let i=enemies.length-1;
        i>=0;
        i--
    ){

        const enemy =
            enemies[i];


        const dx =
            enemy.x-player.x;

        const dy =
            enemy.y-player.y;

        const distance =
            Math.sqrt(
                dx*dx+
                dy*dy
            );


        if(distance<75){

            enemy.health--;

            enemy.hit=8;


            if(enemy.health<=0){

                enemies.splice(i,1);

                score++;

                spawnEnemy();

            }

        }

    }

}


/* =========================================
   MOVE PLAYER
========================================= */

function movePlayer(){

    let dx=0;
    let dy=0;


    if(keys["w"]){

        dy--;

    }

    if(keys["s"]){

        dy++;

    }

    if(keys["a"]){

        dx--;

    }

    if(keys["d"]){

        dx++;

    }


    if(dx!==0 || dy!==0){

        const length =
            Math.sqrt(
                dx*dx+
                dy*dy
            );

        dx/=length;
        dy/=length;


        player.x +=
            dx*player.speed;

        player.y +=
            dy*player.speed;

    }


    player.x =
        Math.max(
            player.size,
            Math.min(
                world.width-player.size,
                player.x
            )
        );


    player.y =
        Math.max(
            player.size,
            Math.min(
                world.height-player.size,
                player.y
            )
        );

}


/* =========================================
   ENEMY AI
========================================= */

function updateEnemies(){

    for(
        const enemy
        of enemies
    ){

        const dx =
            player.x-enemy.x;

        const dy =
            player.y-enemy.y;

        const distance =
            Math.sqrt(
                dx*dx+
                dy*dy
            );


        if(distance>35){

            enemy.x +=
                dx/distance*
                enemy.speed;

            enemy.y +=
                dy/distance*
                enemy.speed;

        }

        else{

            if(
                player.invincible<=0
            ){

                player.health -=
                    .25;

                player.invincible =
                    20;

            }

        }


        if(enemy.hit>0){

            enemy.hit--;

        }

    }

}


/* =========================================
   CAMERA
========================================= */

function updateCamera(){

    camera.x =
        player.x -
        width/2;

    camera.y =
        player.y -
        height/2;


    camera.x =
        Math.max(
            0,
            Math.min(
                world.width-width,
                camera.x
            )
        );


    camera.y =
        Math.max(
            0,
            Math.min(
                world.height-height,
                camera.y
            )
        );

}


/* =========================================
   DRAW BACKGROUND
========================================= */

function drawBackground(){

    ctx.fillStyle =
        "#09080d";

    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    /* MOON */

    const moonX =
        1900-camera.x;

    const moonY =
        180-camera.y;


    const glow =
        ctx.createRadialGradient(
            moonX,
            moonY,
            20,
            moonX,
            moonY,
            180
        );


    glow.addColorStop(
        0,
        "rgba(255,235,190,.45)"
    );

    glow.addColorStop(
        1,
        "rgba(255,235,190,0)"
    );


    ctx.fillStyle =
        glow;


    ctx.beginPath();

    ctx.arc(
        moonX,
        moonY,
        180,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.fillStyle =
        "#e8ddc1";


    ctx.beginPath();

    ctx.arc(
        moonX,
        moonY,
        55,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* GROUND */

    ctx.fillStyle =
        "#101016";


    ctx.fillRect(
        -camera.x,
        -camera.y,
        world.width,
        world.height
    );


    /* GRID */

    ctx.strokeStyle =
        "rgba(100,80,70,.12)";

    ctx.lineWidth=1;


    const grid=100;


    for(
        let x=0;
        x<world.width;
        x+=grid
    ){

        ctx.beginPath();

        ctx.moveTo(
            x-camera.x,
            -camera.y
        );

        ctx.lineTo(
            x-camera.x,
            world.height-camera.y
        );

        ctx.stroke();

    }


    for(
        let y=0;
        y<world.height;
        y+=grid
    ){

        ctx.beginPath();

        ctx.moveTo(
            -camera.x,
            y-camera.y
        );

        ctx.lineTo(
            world.width-camera.x,
            y-camera.y
        );

        ctx.stroke();

    }


    /* RUINS */

    for(
        let i=0;
        i<15;
        i++
    ){

        const rx =
            100+
            i*157;

        const ry =
            200+
            (i%5)*270;


        ctx.fillStyle =
            "#19171d";


        ctx.fillRect(
            rx-camera.x,
            ry-camera.y,
            60,
            100
        );


        ctx.fillStyle =
            "#242027";


        ctx.fillRect(
            rx-10-camera.x,
            ry-10-camera.y,
            80,
            12
        );

    }

}


/* =========================================
   DRAW PLAYER
========================================= */

function drawPlayer(){

    const x =
        player.x-camera.x;

    const y =
        player.y-camera.y;


    /* SHADOW */

    ctx.fillStyle =
        "rgba(0,0,0,.5)";

    ctx.beginPath();

    ctx.ellipse(
        x,
        y+18,
        25,
        10,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* BODY */

    ctx.fillStyle =
        "#29151e";

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        player.size,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* HEAD */

    ctx.fillStyle =
        "#c5a887";

    ctx.beginPath();

    ctx.arc(
        x,
        y-18,
        9,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* SWORD */

    ctx.strokeStyle =
        "#dbcda9";

    ctx.lineWidth=5;


    ctx.beginPath();

    ctx.moveTo(
        x+10,
        y-4
    );

    ctx.lineTo(
        x+38,
        y-35
    );

    ctx.stroke();


    /* ATTACK CIRCLE */

    if(
        player.attackTimer>0
    ){

        ctx.strokeStyle =
            "rgba(225,190,130,.8)";

        ctx.lineWidth=5;


        ctx.beginPath();

        ctx.arc(
            x,
            y,
            70,
            0,
            Math.PI*2
        );

        ctx.stroke();

    }

}


/* =========================================
   DRAW ENEMIES
========================================= */

function drawEnemies(){

    for(
        const enemy
        of enemies
    ){

        const x =
            enemy.x-camera.x;

        const y =
            enemy.y-camera.y;


        /* SHADOW */

        ctx.fillStyle =
            "rgba(0,0,0,.6)";

        ctx.beginPath();

        ctx.ellipse(
            x,
            y+16,
            23,
            9,
            0,
            0,
            Math.PI*2
        );

        ctx.fill();


        /* BODY */

        ctx.fillStyle =
            enemy.hit>0
            ? "#dddddd"
            : "#471522";


        ctx.beginPath();

        ctx.arc(
            x,
            y,
            enemy.size,
            0,
            Math.PI*2
        );

        ctx.fill();


        /* EYES */

        ctx.fillStyle =
            "#ff5260";


        ctx.fillRect(
            x-8,
            y-4,
            5,
            5
        );


        ctx.fillRect(
            x+3,
            y-4,
            5,
            5
        );

    }

}


/* =========================================
   UPDATE UI
========================================= */

function updateUI(){

    const hp =
        Math.max(
            0,
            player.health/
            player.maxHealth*
            100
        );


    document
    .getElementById("health")
    .style.width =
        hp+"%";


    document
    .getElementById("scoreNumber")
    .textContent =
        score;

}


/* =========================================
   GAME OVER
========================================= */

function checkGameOver(){

    if(
        player.health<=0
    ){

        running=false;

        document
        .getElementById("gameOver")
        .style.display =
        "flex";

    }

}


/* =========================================
   GAME LOOP
========================================= */

function gameLoop(){

    if(!running){

        return;

    }


    movePlayer();

    updateEnemies();

    updateCamera();


    if(
        player.attackTimer>0
    ){

        player.attackTimer--;

    }


    if(
        player.invincible>0
    ){

        player.invincible--;

    }


    updateUI();

    checkGameOver();


    drawBackground();

    drawEnemies();

    drawPlayer();


    requestAnimationFrame(
        gameLoop
    );

}


/* =========================================
   RESTART
========================================= */

document
.getElementById("restartButton")
.addEventListener(
    "click",
    function(){

        document
        .getElementById("gameOver")
        .style.display =
        "none";

        startGame();

    }
);


/* =========================================
   MOBILE BUTTONS
========================================= */

function holdButton(
    id,
    key
){

    const button =
        document.getElementById(id);


    button.addEventListener(
        "touchstart",
        function(e){

            e.preventDefault();

            keys[key]=true;

        }
    );


    button.addEventListener(
        "touchend",
        function(e){

            e.preventDefault();

            keys[key]=false;

        }
    );

}


holdButton(
    "up",
    "w"
);

holdButton(
    "down",
    "s"
);

holdButton(
    "left",
    "a"
);

holdButton(
    "right",
    "d"
);


document
.getElementById("attackButton")
.addEventListener(
    "touchstart",
    function(e){

        e.preventDefault();

        attack();

    }
);

</script>

</body>
</html>
