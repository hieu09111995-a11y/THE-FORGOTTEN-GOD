<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>THE FORGOTTEN GOD</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050507;
    font-family: Georgia, serif;
}

#game {
    position: fixed;
    inset: 0;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
}

#menu {
    position: fixed;
    inset: 0;
    z-index: 10;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    background:
        radial-gradient(
            circle at center,
            #24151c,
            #08070a 65%,
            #020203
        );

    color: #dfc693;
    text-align: center;
}

h1 {
    margin: 0;

    font-size: clamp(45px, 9vw, 100px);
    letter-spacing: 8px;

    text-shadow:
        0 0 15px #8c3546,
        0 0 40px #5b1828;
}

p {
    letter-spacing: 5px;
    color: #988b7b;
}

button {
    margin-top: 35px;

    width: 260px;
    height: 60px;

    background: #110c11;
    border: 1px solid #a68a60;

    color: #dfc693;

    font-family: Georgia, serif;
    font-size: 16px;
    letter-spacing: 3px;

    cursor: pointer;
}

button:hover {
    background: #291720;
}

#ui {
    display: none;

    position: fixed;
    top: 20px;
    left: 20px;

    z-index: 5;

    color: white;
    font-family: Arial, sans-serif;
}

#bar {
    width: 220px;
    height: 18px;

    margin-top: 6px;

    border: 1px solid #9c8058;
    background: #180b10;
}

#hp {
    width: 100%;
    height: 100%;
    background: #a52f43;
}

#info {
    margin-top: 8px;
    color: #d8c18e;
}

#gameover {
    display: none;

    position: fixed;
    inset: 0;

    z-index: 20;

    justify-content: center;
    align-items: center;
    flex-direction: column;

    background: rgba(0,0,0,.9);

    color: #c94a58;
}

#gameover h2 {
    font-size: 60px;
    letter-spacing: 6px;
}
</style>
</head>

<body>

<div id="game">
    <canvas id="canvas"></canvas>
</div>

<div id="menu">

    <h1>
        THE<br>
        FORGOTTEN GOD
    </h1>

    <p>
        THE DARKNESS REMEMBERS
    </p>

    <button id="start">
        ENTER THE WORLD
    </button>

</div>

<div id="ui">

    LIFE

    <div id="bar">
        <div id="hp"></div>
    </div>

    <div id="info">
        SOULS: <span id="score">0</span>
    </div>

    <div style="margin-top:10px;">
        WASD: MOVE<br>
        SPACE: ATTACK
    </div>

</div>

<div id="gameover">

    <h2>YOU DIED</h2>

    <button id="again">
        TRY AGAIN
    </button>

</div>


<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W = 0;
let H = 0;

function resize() {

    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = W;
    canvas.height = H;
}

resize();

window.addEventListener("resize", resize);


/* =========================
   GAME
========================= */

let playing = false;

let score = 0;

const keys = {};

const player = {
    x: 0,
    y: 0,
    speed: 4,
    hp: 100,
    maxHp: 100,
    attack: 0
};

let enemies = [];


/* =========================
   KEYBOARD
========================= */

window.addEventListener("keydown", function(e) {

    keys[e.key.toLowerCase()] = true;

    if (e.code === "Space") {

        e.preventDefault();

        attack();
    }
});

window.addEventListener("keyup", function(e) {

    keys[e.key.toLowerCase()] = false;
});


/* =========================
   START
========================= */

document.getElementById("start").onclick = function() {

    startGame();

};


/* =========================
   START GAME
========================= */

function startGame() {

    document.getElementById("menu").style.display = "none";

    document.getElementById("gameover").style.display = "none";

    document.getElementById("ui").style.display = "block";

    playing = true;

    score = 0;

    player.x = W / 2;
    player.y = H / 2;

    player.hp = 100;

    enemies = [];

    for (let i = 0; i < 6; i++) {

        createEnemy();
    }

    requestAnimationFrame(loop);
}


/* =========================
   CREATE ENEMY
========================= */

function createEnemy() {

    let x;
    let y;

    do {

        x = 80 + Math.random() * (W - 160);
        y = 80 + Math.random() * (H - 160);

    } while (
        Math.abs(x - player.x) < 180 &&
        Math.abs(y - player.y) < 180
    );

    enemies.push({

        x: x,
        y: y,

        size: 20,

        speed: 1,

        hp: 2

    });
}


/* =========================
   MOVE PLAYER
========================= */

function movePlayer() {

    let dx = 0;
    let dy = 0;

    if (keys["w"]) dy -= 1;
    if (keys["s"]) dy += 1;
    if (keys["a"]) dx -= 1;
    if (keys["d"]) dx += 1;

    if (dx !== 0 || dy !== 0) {

        const length =
            Math.sqrt(dx * dx + dy * dy);

        dx /= length;
        dy /= length;

        player.x += dx * player.speed;
        player.y += dy * player.speed;
    }

    player.x = Math.max(
        30,
        Math.min(W - 30, player.x)
    );

    player.y = Math.max(
        30,
        Math.min(H - 30, player.y)
    );
}


/* =========================
   ATTACK
========================= */

function attack() {

    if (!playing) return;

    if (player.attack > 0) return;

    player.attack = 15;

    for (let i = enemies.length - 1; i >= 0; i--) {

        const e = enemies[i];

        const dx = e.x - player.x;
        const dy = e.y - player.y;

        const distance =
            Math.sqrt(dx * dx + dy * dy);

        if (distance < 80) {

            e.hp--;

            if (e.hp <= 0) {

                enemies.splice(i, 1);

                score++;

                createEnemy();
            }
        }
    }
}


/* =========================
   ENEMIES
========================= */

function updateEnemies() {

    for (const e of enemies) {

        const dx = player.x - e.x;
        const dy = player.y - e.y;

        const distance =
            Math.sqrt(dx * dx + dy * dy);

        if (distance > 38) {

            e.x +=
                dx / distance *
                e.speed;

            e.y +=
                dy / distance *
                e.speed;

        } else {

            player.hp -= 0.2;
        }
    }
}


/* =========================
   DRAW
========================= */

function draw() {

    /* BACKGROUND */

    ctx.fillStyle = "#08080d";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /* MOON */

    const gradient =
        ctx.createRadialGradient(
            W - 150,
            130,
            10,
            W - 150,
            130,
            180
        );

    gradient.addColorStop(
        0,
        "rgba(255,230,180,.35)"
    );

    gradient.addColorStop(
        1,
        "rgba(255,230,180,0)"
    );

    ctx.fillStyle = gradient;

    ctx.beginPath();

    ctx.arc(
        W - 150,
        130,
        180,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* MOON */

    ctx.fillStyle = "#e6d9bb";

    ctx.beginPath();

    ctx.arc(
        W - 150,
        130,
        48,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* GROUND */

    ctx.fillStyle = "#111117";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /* GRID */

    ctx.strokeStyle =
        "rgba(120,100,100,.12)";

    for (
        let x = 0;
        x < W;
        x += 80
    ) {

        ctx.beginPath();

        ctx.moveTo(x, 0);

        ctx.lineTo(x, H);

        ctx.stroke();
    }

    for (
        let y = 0;
        y < H;
        y += 80
    ) {

        ctx.beginPath();

        ctx.moveTo(0, y);

        ctx.lineTo(W, y);

        ctx.stroke();
    }


    /* ENEMIES */

    for (const e of enemies) {

        ctx.fillStyle = "#591827";

        ctx.beginPath();

        ctx.arc(
            e.x,
            e.y,
            e.size,
            0,
            Math.PI * 2
        );

        ctx.fill();


        /* EYES */

        ctx.fillStyle = "#ff5360";

        ctx.fillRect(
            e.x - 8,
            e.y - 4,
            5,
            5
        );

        ctx.fillRect(
            e.x + 3,
            e.y - 4,
            5,
            5
        );
    }


    /* PLAYER */

    ctx.fillStyle = "#321723";

    ctx.beginPath();

    ctx.arc(
        player.x,
        player.y,
        24,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* HEAD */

    ctx.fillStyle = "#c7aa88";

    ctx.beginPath();

    ctx.arc(
        player.x,
        player.y - 27,
        9,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* SWORD */

    ctx.strokeStyle = "#e3d4ad";

    ctx.lineWidth = 5;

    ctx.beginPath();

    ctx.moveTo(
        player.x + 10,
        player.y - 5
    );

    ctx.lineTo(
        player.x + 42,
        player.y - 38
    );

    ctx.stroke();


    /* ATTACK */

    if (player.attack > 0) {

        ctx.strokeStyle =
            "rgba(235,200,140,.8)";

        ctx.lineWidth = 4;

        ctx.beginPath();

        ctx.arc(
            player.x,
            player.y,
            75,
            0,
            Math.PI * 2
        );

        ctx.stroke();
    }
}


/* =========================
   UI
========================= */

function updateUI() {

    const hp =
        Math.max(
            0,
            player.hp
        );

    document.getElementById("hp")
        .style.width =
        hp + "%";

    document.getElementById("score")
        .textContent =
        score;
}


/* =========================
   LOOP
========================= */

function loop() {

    if (!playing) return;

    movePlayer();

    updateEnemies();

    if (player.attack > 0) {
        player.attack--;
    }

    updateUI();

    draw();


    if (player.hp <= 0) {

        playing = false;

        document.getElementById("gameover")
            .style.display = "flex";

        return;
    }

    requestAnimationFrame(loop);
}


/* =========================
   RESTART
========================= */

document.getElementById("again").onclick =
function() {

    startGame();

};

</script>

</body>
</html>
